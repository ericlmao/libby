name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (tests on JDK ${{ matrix.test-jdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-jdk: [17, 21, 25]
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      # All JDKs are installed; the last one listed becomes JAVA_HOME and runs Gradle,
      # which matches the Java 21 build toolchain.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: >-
          ./gradlew build
          -Plibby.testJdk=${{ matrix.test-jdk }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64
          -Porg.gradle.java.installations.auto-download=false

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk-${{ matrix.test-jdk }}
          path: '**/build/reports/tests/'
