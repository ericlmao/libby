[versions]
spigot-api = "1.20.4-R0.1-SNAPSHOT"
paper-api = "1.20.4-R0.1-SNAPSHOT"
bungeecord-api = "1.21-R0.3"
# 3.4.0 is the newest release whose metadata targets Java 17 (3.5.x requires Java 21).
velocity-api = "3.4.0"
nukkit = "1.0-SNAPSHOT"
slf4j = "2.0.20"
jspecify = "1.0.1"
junit = "6.1.3"

# Tools that libby downloads at runtime to relocate jars. They are not compile
# dependencies: the versions and SHA-256 checksums are pinned in
# net.byteflux.libby.relocation.RelocationHelper and must be kept in sync with
# these entries, which only feed the offline relocation test repository.
jar-relocator = "1.7"
asm = "9.11.1"

[libraries]
spigot-api = { module = "org.spigotmc:spigot-api", version.ref = "spigot-api" }
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
bungeecord-api = { module = "net.md-5:bungeecord-api", version.ref = "bungeecord-api" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity-api" }
nukkit = { module = "cn.nukkit:nukkit", version.ref = "nukkit" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
jar-relocator = { module = "me.lucko:jar-relocator", version.ref = "jar-relocator" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-commons = { module = "org.ow2.asm:asm-commons", version.ref = "asm" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
